<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>새싹영단어</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="theme-color" content="#3b9e3b" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>🌱 새싹영단어</h1>
      <button id="resetBtn" class="icon-btn" title="처음부터 다시 시작">↺</button>
    </header>

    <div class="progress-wrap">
      <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
      <div id="progressText" class="progress-text">0 / 800</div>
    </div>

    <main id="quizScreen" class="card">
      <div class="word-area" id="wordArea">
        <div id="wordText" class="word-text">word</div>
        <div class="hint">👆 단어를 클릭하면 발음을 들려줘요</div>
      </div>

      <div id="choices" class="choices"></div>

      <div id="feedback" class="feedback"></div>
    </main>

    <section id="doneScreen" class="card done-screen hidden">
      <div class="done-emoji">🎉</div>
      <h2>800개 단어를 모두 마스터했어요!</h2>
      <p id="doneStats"></p>
      <button id="restartBtn" class="primary-btn">다시 처음부터</button>
    </section>
  </div>

  <script src="words.js"></script>
  <script src="app.js"></script>
</body>
</html>

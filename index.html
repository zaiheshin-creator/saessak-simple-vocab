<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>새싹영단어</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="theme-color" content="#3b9e3b" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 id="appTitle">🌱 새싹영단어</h1>
      <button id="resetBtn" class="icon-btn hidden" title="이 레벨 처음부터 다시 시작">↺</button>
    </header>

    <section id="levelScreen" class="card level-screen">
      <p class="level-intro">레벨을 선택해서 학습을 시작하세요</p>

      <div class="mode-select-label">출제 방식</div>
      <div id="directionModeSelector" class="direction-mode-selector">
        <button class="dir-mode-btn" data-mode="forward">🔤 단어→뜻</button>
        <button class="dir-mode-btn" data-mode="reverse">🔍 뜻→단어</button>
        <button class="dir-mode-btn" data-mode="mixed">🔀 섞어서</button>
      </div>

      <div id="levelList" class="level-list"></div>
      <button id="summaryOpenBtn" class="summary-open-btn">📊 오늘의 학습 요약 보기</button>
      <div id="updatedLabel" class="updated-label"></div>
    </section>

    <section id="summaryScreen" class="card summary-screen hidden">
      <button id="summaryBackBtn" class="back-btn">← 레벨 선택</button>
      <h2 class="summary-title">📊 오늘의 학습 요약</h2>

      <div id="summaryTodayBox" class="summary-today-box"></div>

      <div class="summary-section-title">🔁 자주 틀리는 단어</div>
      <div id="summaryWeakList" class="summary-weak-list"></div>
    </section>

    <div id="progressWrap" class="progress-wrap hidden">
      <button id="backBtn" class="back-btn">← 레벨 선택</button>
      <div id="roundLabel" class="round-label"></div>
      <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
      <div id="progressText" class="progress-text">0 / 0</div>
    </div>

    <main id="quizScreen" class="card hidden">
      <div class="word-area" id="wordArea">
        <div id="directionTag" class="direction-tag"></div>
        <div id="wordText" class="word-text">word</div>
        <div id="wordHint" class="hint">👆 단어를 클릭하면 발음을 들려줘요</div>
      </div>

      <button id="slowBtn" class="slow-btn">🐢 천천히 듣기</button>

      <div class="hint-row">
        <button id="hintBtn" class="hint-btn">💡 힌트</button>
        <div id="hintText" class="hint-text hidden"></div>
      </div>

      <div id="choices" class="choices"></div>

      <div id="feedback" class="feedback"></div>
    </main>

    <section id="doneScreen" class="card done-screen hidden">
      <div class="done-emoji">🎉</div>
      <h2 id="doneTitle">이 레벨의 단어를 모두 마스터했어요!</h2>
      <p id="doneStats"></p>
      <button id="restartBtn" class="primary-btn">이 레벨 다시 학습</button>
      <button id="doneBackBtn" class="secondary-btn">레벨 선택으로</button>
    </section>
  </div>

  <script src="words.js"></script>
  <script src="version.js"></script>
  <script src="app.js"></script>
</body>
</html>
